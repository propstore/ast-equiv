[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ast-equiv"
version = "0.1.0"
description = "Python AST equivalence comparison"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "sympy>=1.14.0",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "pyright", "hatchling", "editables"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "property: Hypothesis-backed property tests",
]

[tool.pyright]
include = ["ast_equiv"]
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportPossiblyUnboundVariable = "none"
reportReturnType = "none"

[tool.hatch.build.targets.wheel]
packages = ["ast_equiv"]
